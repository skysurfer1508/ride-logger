# XcodeGen spec. On the Mac:  brew install xcodegen && cd ios && xcodegen generate && open RideLog.xcodeproj
# The Xcode project itself is not committed (see the repo .gitignore); this file is the source of truth. Run `xcodegen generate`
# again after every `git pull` that adds or removes Swift files.
name: RideLog
options:
  bundleIdPrefix: com.skyserver1508
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"          # Swift 5 language mode: no strict-concurrency errors on the first build
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "14"
targets:
  RideLog:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
    dependencies:
      - target: RideLogWidgets                         # the Live Activity / Dynamic Island (embedded in the app)
    scheme:
      testTargets:
        - RideLogTests                                 # `xcodebuild test -scheme RideLog` (and Cmd+U) runs the unit tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skyserver1508.ridelogger
        PRODUCT_NAME: RideLog
        TARGETED_DEVICE_FAMILY: "1"                    # iPhone only
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic                     # your team comes from Signing.local.xcconfig (see Config.xcconfig)
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: RideLog
        SiteHost: $(SITE_HOST)
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark                     # the website is a night-mode dash; so is the app
        NSSupportsLiveActivities: true                 # speed and distance on the Lock Screen and in the Dynamic Island
        UIBackgroundModes:
          - location                                   # keep recording a ride with the screen locked
        NSLocationWhenInUseUsageDescription: RideLog uses your location while you record a ride, to draw the route and work out distance and speed. It keeps recording with the screen locked until you press Stop. The Traffic tab uses it to show where you are on the map. Your rides are uploaded only to your own server.
        NSLocationAlwaysAndWhenInUseUsageDescription: RideLog can notice that you started riding while the app is closed, and then start recording for you. This only happens if you turn on "Notice when I start riding" in Settings. Nothing is recorded until a ride starts, and rides go only to your own server.
        NSMotionUsageDescription: RideLog asks the motion sensor whether you are in a vehicle, so that it does not start recording when you are only walking.
        NSLocationTemporaryUsageDescriptionDictionary:
          RecordRide: RideLog needs your precise location to record the route and speed of your ride accurately.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  RideLogWidgets:
    # The Live Activity. If this target ever stops the app from building: delete this block, the `- target: RideLogWidgets` dependency and
    # `NSSupportsLiveActivities` above, the `RideLogWidgets/` and `Shared/RideActivityAttributes.swift` files, and
    # Sources/Recording/LiveActivityController.swift together with its uses in RideRecorder.swift. Recording itself does not depend on it.
    type: app-extension
    platform: iOS
    sources:
      - RideLogWidgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skyserver1508.ridelogger.widgets
        PRODUCT_NAME: RideLogWidgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    info:
      path: RideLogWidgets/Info.plist
      properties:
        CFBundleDisplayName: RideLog
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  RideLogWatch:
    # The Apple Watch app (a remote control and a glanceable display; the iPhone stays the only recorder). Deliberately NOT a dependency of RideLog and not
    # embedded in it: the iPhone app builds and runs without ever compiling this target, so a problem here cannot stop the iPhone app. To put it on the watch, pick
    # the "RideLogWatch" scheme in Xcode, choose your paired Apple Watch as the run destination, and press Run (see ios/README.md). To remove the Watch support
    # altogether: delete the RideLogWatch and RideLogWatchWidgets blocks, the RideLogWatch/ and RideLogWatchWidgets/ folders, and Sources/Watch/WatchBridge.swift
    # with its two uses (AppServices.swift, RootView.swift). Shared/WatchProtocol.swift and its test can stay.
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - RideLogWatch
      - path: Shared/WatchProtocol.swift
    dependencies:
      - target: RideLogWatchWidgets                    # the complication (embedded in the Watch app)
    entitlements:
      path: RideLogWatch/RideLogWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.skyserver1508.ridelogger.watch   # how the complication reads what the Watch app received
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skyserver1508.ridelogger.watchkitapp
        PRODUCT_NAME: RideLogWatch
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: RideLogWatch/Info.plist
      properties:
        CFBundleDisplayName: RideLog
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.skyserver1508.ridelogger
        WKRunsIndependentlyOfCompanionApp: false
  RideLogWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - RideLogWatchWidgets
      - path: Shared/WatchProtocol.swift
    entitlements:
      path: RideLogWatchWidgets/RideLogWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.skyserver1508.ridelogger.watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skyserver1508.ridelogger.watchkitapp.widgets
        PRODUCT_NAME: RideLogWatchWidgets
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
    info:
      path: RideLogWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: RideLog
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  RideLogTests:
    type: bundle.unit-test
    platform: iOS
    # Only Foundation-level files are compiled into the tests (no UIKit/SwiftUI), the same way the Overload app does it.
    sources:
      - Tests
      - Sources/Core/Logic.swift
      - Sources/Core/PKCE.swift
      - Sources/Core/Format.swift
      - Sources/Core/RideFilters.swift
      - Sources/API/Models.swift
      - Sources/API/TrackModels.swift
      - Sources/Core/TrackMath.swift
      - Sources/API/TrafficModels.swift
      - Sources/API/ImportModels.swift
      - Sources/API/GarageModels.swift
      - Sources/API/InsightsModels.swift
      - Sources/Core/InsightsLogic.swift
      - Sources/API/RoadsModels.swift
      - Sources/Core/RoadsLogic.swift
      - Sources/API/PlannerModels.swift
      - Sources/Core/PlannerLogic.swift
      - Sources/Core/RouteFollow.swift
      - Shared/WatchProtocol.swift
      - Sources/AutoStart/AutoStartLogic.swift
      - Sources/AutoStart/AutoStartLog.swift
      - Sources/Core/TrafficLogic.swift
      - Sources/API/ResponseCache.swift
      - Sources/Recording/RecordingLogic.swift
      - Sources/Recording/IngestPayload.swift
      - Sources/Recording/TripStore.swift
      - Shared/LiveSnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skyserver1508.ridelogger.tests
        GENERATE_INFOPLIST_FILE: YES
